record_type: approval
required:
  - approval_id
  - requested_by_agent
  - action
  - scope
  - evidence_refs
  - status
fields:
  approval_id: string
  requested_by_agent: string
  action: string
  scope: string
  evidence_refs: list
  budget_ceiling: string
  risk_notes: list
  rollback_plan: string
  approver: string
  status: requested | approved | rejected | expired | revoked
  expires_at: iso_datetime